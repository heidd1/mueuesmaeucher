		<meta
			property="og:title"
			content="Website Müüsmäucher - Startseite">
			<meta
			property="og:url"
			content="https://mueuesmaeucher.ch/">
		<meta
			property="og:site_name"
			content="mueuesmaeucher.ch">
		<meta
			property="og:description"
			content="Website des Verein Müüsmäucher Winznau. Gegründet im Jahr 2019. Wir machen zusammen Ausflüge und organisieren gesellige Anlässe für das Dorf und seine Einwohner*innen">
		<meta 
			property="og:type"
			content="website">
		<meta 
			property="og:image" 
			content="https://mueuesmaeucher.ch/social_media.png">
		<meta 
			property="og:image:width" 
			content="1200">
		<meta 
			property="og:image:height" 
			content="630">
		<link 
			rel="canonical" 
			href="https://mueuesmaeucher.ch/">
		<link 
			rel="preconnect" 
			href="https://fonts.googleapis.com">
		<link 
			rel="preconnect" 
			href="https://fonts.gstatic.com" crossorigin>
		<link 
			href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" 
			rel="stylesheet">
		<link 
			rel="stylesheet" 
			href="style.css">
		<link rel="icon" type="image/svg+xml" href="/favicon.svg">
		<link rel="alternate icon" href="/favicon.png"> <!-- Fallback -->
	</head>
	<body>
		<header>
			<a href="index.html">
				<img 
					src="logo.png" 
					alt="Logo Müüsmäucher Winznau">
			</a>
			<h1>Müüsmäucher Winznau</h1>
			<nav>
				<a href="index.html">Startseite</a>
				<a href="ueber-uns.html">Über uns</a>
				<a href="aktuelles.html">Aktuelles</a>
				<a href="goenner.html">Gönnerwesen</a>
				<a href="galerie.html">Galerie</a>
				<a href="kontakt.html">Kontakt</a>
			</nav>
		</header>
		<main class="container">
			<h2>Willkommen</h2>
			<p>Herzlich willkommen beim Verein <strong>Müüsmäucher Winznau</strong>. Wir stehen für Gemeinschaft, Tradition und Geselligkeit in Winznau.</p>
			<div class="gallery">
				<img src="bilder/Seite1.png" alt="Seite 1" onclick="openLightbox(this)">
				<img src="bilder/Seite2.png" alt="Seite 2" onclick="openLightbox(this)">
				<img src="bilder/Seite4.png" alt="Seite 3" onclick="openLightbox(this)">
				<img src="bilder/Girouds.jpeg" alt="Girouds" onclick="openLightbox(this)">
				<img src="bilder/Risotto.jpeg" alt="Risotto" onclick="openLightbox(this)">
			</div>
			<div class="lightbox" id="lightbox">
				<span class="nav prev" onclick="changeImg(-1)">&#10094;</span>
				<img id="lightbox-img" alt="Vergrößerte Ansicht">
				<span class="nav next" onclick="changeImg(1)">&#10095;</span>
			</div>
		</main>
		<footer>&copy; 2026 Müüsmäucher Winznau</footer>
		<script>
			const galleryImages = [...document.querySelectorAll('.gallery img')].map(img => img.src);
			let galleryIndex = 0;

			function openLightbox(img) {
				galleryIndex = galleryImages.indexOf(img.src);
				document.getElementById('lightbox-img').src = img.src;
				document.getElementById('lightbox').style.display = 'flex';
			}

			function changeImg(step) {
				galleryIndex = (galleryIndex + step + galleryImages.length) % galleryImages.length;
				document.getElementById('lightbox-img').src = galleryImages[galleryIndex];
			}

			document.getElementById('lightbox').onclick = function(e) {
				if (e.target.id === 'lightbox') {
					e.target.style.display = 'none';
				}
			};
		</script>
	</body>
</html>
