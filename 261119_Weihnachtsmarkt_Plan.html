:root{--g:#004900;--bg:#e9ddaf;--paper:#f6efd8;--acc:#c8731a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--g);font-family:'Agency FB','Arial Narrow',sans-serif;font-size:20px}
html{-webkit-text-size-adjust:100%}
main{max-width:1700px;margin:0 auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.map{background:#f6efd8;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px #0003}
.map svg{display:block;width:100%;height:auto}
.hit{fill:transparent;stroke:transparent;stroke-width:12;pointer-events:all;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.hl{fill:var(--acc);opacity:0;pointer-events:none;transition:opacity .15s}
.hl.hv{opacity:.5}
.hl.on{opacity:.95}
.hit:focus-visible{stroke:var(--acc);stroke-width:3}
aside{position:sticky;top:12px}
.card{background:var(--paper);border:3px dashed var(--g);border-radius:10px;padding:18px 20px;min-height:200px}
.card h1{margin:0 0 4px;font-size:34px;line-height:1}
.card .nr{font-size:22px;color:var(--acc);font-weight:700;letter-spacing:.04em}
.card .badge{display:inline-block;background:var(--g);color:#fff;border-radius:4px;padding:1px 9px;font-size:18px;margin:8px 0 12px}
.card ul{margin:0 0 4px;padding-left:22px;font-size:24px;line-height:1.25}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:700 21px 'Agency FB','Arial Narrow',sans-serif;text-decoration:none;color:#fff;background:var(--g);border:2px solid var(--g);border-radius:6px;padding:6px 14px;display:inline-block}
.btn:hover{background:var(--acc);border-color:var(--acc)}
.btn.off{background:transparent;color:var(--g);opacity:.55;border-style:dashed;cursor:default}
.btn.off:hover{background:transparent;border-color:var(--g)}
.card p{margin:0;font-size:24px;line-height:1.2}
.card .hint{font-size:21px;opacity:.8}
.card .x{float:right;background:none;border:0;font:700 30px/1 'Agency FB';color:var(--g);cursor:pointer;display:none}
.card.open .x{display:block}
.list{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.list button{font:700 18px 'Agency FB','Arial Narrow',sans-serif;color:var(--g);background:var(--paper);border:2px solid var(--g);border-radius:5px;padding:2px 9px;cursor:pointer}
.list button.on,.list button:hover{background:var(--g);color:#fff}
@media(max-width:860px){
 body{font-size:19px}
 main{grid-template-columns:1fr;padding:6px;gap:10px}
 .map{border-radius:8px}
 aside{position:static;order:2}
 .card{position:fixed;left:8px;right:8px;bottom:8px;z-index:5;min-height:0;max-height:60vh;overflow:auto;box-shadow:0 4px 20px #0006;display:none;padding:14px 16px}
 .card h1{font-size:30px}.card p,.card ul{font-size:22px}
 .card.open{display:block}
 .map{order:1}
}

const card=document.getElementById('card'),body=document.getElementById('body'),list=document.getElementById('list');

 if(s.tent){
  const btn=(u,t)=>u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${t} (PDF)</a>`:`<span class="btn off">${t} – folgt</span>`;

} else
 body.innerHTML=`<div class="nr">Stand ${esc(s.nr)}</div><h1>${esc(s.name)}</h1><span class="badge">${esc(s.size)}</span><p>${esc(s.offer)}</p>${s.nopos?'<p class="hint" style="margin-top:8px">Standort auf dem Plan folgt.</p>':''}`;
 card.classList.add('open');

function clr(){cur=-1;document.querySelectorAll('.hl').forEach(h=>h.classList.remove('on'));list.querySelectorAll('button').forEach(b=>b.classList.remove('on'));card.classList.remove('open');body.innerHTML='<p class="hint">Tippe auf einen Stand im Plan, um Name und Angebot zu sehen.</p>'}

document.querySelectorAll('.hit').forEach(h=>{
 const i=+h.dataset.i,g=h.parentNode;

 h.addEventListener('mouseleave',()=>document.querySelectorAll('.hl.hv').forEach(x=>x.classList.remove('hv')));
