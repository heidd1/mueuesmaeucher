		<script>
		let currentYear = 0;
		let currentEvent = 0;
		let currentIndex = 0;
		const eventImages = [];

		document.querySelectorAll('.year-content').forEach((year, yi) => {
			const events = [...year.querySelectorAll('.event-content')];
			eventImages[yi] = events.map(event => [...event.querySelectorAll('img')].map(img => img.src));
		});

		function openYearTab(yearIndex) {
			document.querySelectorAll('.years button').forEach((button, bi) => button.classList.toggle('active', bi === yearIndex));
			document.querySelectorAll('.year-content').forEach((year, yi) => year.classList.toggle('active', yi === yearIndex));
			currentYear = yearIndex;
			openEventTab(yearIndex, 0);
		}

		function openEventTab(yearIndex, eventIndex) {
			const year = document.querySelectorAll('.year-content')[yearIndex];
			if (!year) return;

			year.querySelectorAll('.events button').forEach((button, bi) => button.classList.toggle('active', bi === eventIndex));
			year.querySelectorAll('.event-content').forEach((event, ei) => event.classList.toggle('active', ei === eventIndex));
			currentYear = yearIndex;
			currentEvent = eventIndex;
			currentIndex = 0;
		}

		function openLightbox(yearIndex, eventIndex, img) {
			currentYear = yearIndex;
			currentEvent = eventIndex;
			currentIndex = eventImages[yearIndex][eventIndex].indexOf(img.src);
			document.getElementById('lightbox-img').src = img.src;
			document.getElementById('lightbox').style.display = 'flex';
		}

		function changeImg(step) {
			const images = eventImages[currentYear]?.[currentEvent] || [];
			if (!images.length) return;
			currentIndex = (currentIndex + step + images.length) % images.length;
			document.getElementById('lightbox-img').src = images[currentIndex];
		}

		document.getElementById('lightbox').onclick = e => {
			if (e.target.id === 'lightbox') {
				e.target.style.display = 'none';
			}
		};
		</script>
