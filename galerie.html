<!-- ===================== galerie.html ===================== -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Müüsmäucher Winznau – Galerie</title>
<link rel="stylesheet" href="style.css">
<style>
.tabs button{padding:10px 15px;border:none;background:#e0e0e0;margin-right:5px;cursor:pointer;font-weight:bold}
.tabs button.active{background:#7a8f5a;color:#fff}
.tab-content{display:none;margin-top:20px}
.tab-content.active{display:block}
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center}
.lightbox img{max-width:90%;max-height:90%}
.lightbox .nav{position:absolute;top:50%;color:#fff;font-size:40px;cursor:pointer;padding:20px}
.lightbox .prev{left:0}
.lightbox .next{right:0}
</style>
</head>
<body>
<header>
<a href="index.html"><img src="logo.png" alt="Logo Müüsmäucher Winznau"></a>
<h1>Müüsmäucher Winznau</h1>
<nav>
<a href="index.html">Startseite</a>
<a href="ueber-uns.html">Über uns</a>
<a href="aktuelles.html">Aktuelles</a>
<a href="galerie.html">Galerie</a>
<a href="kontakt.html">Kontakt</a>
</nav>
</header>
<main class="container">
<h2>Galerie</h2>
<p>Einige Eindrücke unserer Anlässe. Wähle einen Anlass, um alle Bilder zu sehen.</p>
<div class="tabs">
<button class="active" onclick="openTab(0)">Anlass 1</button>
<button onclick="openTab(1)">Anlass 2</button>
<button onclick="openTab(2)">Anlass 3</button>
</div>
<div class="tab-content active">
<div class="gallery">
<img src="bilder/anlass1_1.jpg" onclick="openLightbox(0, this)">
<img src="bilder/anlass1_2.jpg" onclick="openLightbox(0, this)">
<img src="bilder/anlass1_3.jpg" onclick="openLightbox(0, this)">
</div>
</div>
<div class="tab-content">
<div class="gallery">
<img src="bilder/anlass2_1.jpg" onclick="openLightbox(1, this)">
<img src="bilder/anlass2_2.jpg" onclick="openLightbox(1, this)">
</div>
</div>
<div class="tab-content">
<div class="gallery">
<img src="bilder/anlass3_1.jpg" onclick="openLightbox(1, this)">
<img src="bilder/anlass3_2.jpg" onclick="openLightbox(1, this)">
</div>
</div>
</main>
<div class="lightbox" id="lightbox">
<span class="nav prev" onclick="changeImg(-1)">&#10094;</span>
<img id="lightbox-img">
<span class="nav next" onclick="changeImg(1)">&#10095;</span>
</div>
<footer>&copy; 2026 Müüsmäucher Winznau</footer>
<script>
let currentTab=0,currentIndex=0;const images=[];
document.querySelectorAll('.tab-content').forEach((tab,i)=>{
images[i]=[...tab.querySelectorAll('img')].map(img=>img.src);
});
function openTab(i){document.querySelectorAll('.tabs button').forEach((b,bi)=>b.classList.toggle('active',bi===i));
document.querySelectorAll('.tab-content').forEach((t,ti)=>t.classList.toggle('active',ti===i));currentTab=i}
function openLightbox(tab,img){currentTab=tab;currentIndex=images[tab].indexOf(img.src);
document.getElementById('lightbox-img').src=img.src;document.getElementById('lightbox').style.display='flex'}
function changeImg(step){currentIndex=(currentIndex+step+images[currentTab].length)%images[currentTab].length;
document.getElementById('lightbox-img').src=images[currentTab][currentIndex]}
document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.target.style.display='none'}
</script>
</body>
</html>
