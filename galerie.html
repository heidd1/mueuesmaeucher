<div class="lightbox" id="lightbox">
<span class="nav prev" onclick="changeImg(-1)">&#10094;</span>
<img id="lightbox-img">
<span class="nav next" onclick="changeImg(1)">&#10095;</span>
</div>

<script>
let currentTab=0,currentIndex=0;const images=[];
document.querySelectorAll('.tab-content').forEach((tab,i)=>{
images[i]=[...tab.querySelectorAll('img')].map(img=>img.src);
});
function openTab(i){document.querySelectorAll('.tabs button').forEach((b,bi)=>b.classList.toggle('active',bi===i));
document.querySelectorAll('.tab-content').forEach((t,ti)=>t.classList.toggle('active',ti===i));currentTab=i}
function openLightbox(tab,img){currentTab=tab;currentIndex=images[tab].indexOf(img.src);
document.getElementById('lightbox-img').src=img.src;document.getElementById('lightbox').style.display='flex'}
function changeImg(step){currentIndex=(currentIndex+step+images[currentTab].length)%images[currentTab].length;
document.getElementById('lightbox-img').src=images[currentTab][currentIndex]}
document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.target.style.display='none'}
</script>
